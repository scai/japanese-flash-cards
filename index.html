<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按课学习日语单词：中日双语闪卡，支持多个词卡集与随机练习。">
  <meta name="theme-color" content="#2744cb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="言葉">
  <title>言葉 · 日语词卡</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="textbook-sets.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="./"><span class="logo">言</span><span>言葉 <small>日语词卡</small></span></a>
    <div class="header-context"><span id="lesson"></span><span id="loaded" class="badge"></span></div>
    <div class="menu-wrap"><button id="menu-button" class="secondary" aria-label="菜单" title="菜单" aria-expanded="false" aria-controls="app-menu"><span aria-hidden="true">☰</span></button><nav id="app-menu" aria-label="应用菜单" hidden><button data-panel="sets-panel">词卡集管理</button><button data-panel="preferences-panel">偏好设置</button><button data-panel="history-panel">练习历史</button></nav></div>
  </header>
  <main>
    <dialog id="sets-panel" aria-labelledby="sets-title">
      <div class="panel-heading"><h2 id="sets-title">词卡集管理</h2><button class="close-panel secondary" aria-label="关闭词卡集管理" autofocus>关闭</button></div>
      <div class="section-heading"><h3>我的词卡集</h3><span id="set-count"></span></div>
      <p class="muted">选择一课，或把多课一起练习。</p>
      <div id="sets"></div>
    </dialog>
    <section class="practice" aria-label="闪卡练习">
      <button id="choose-sets" class="secondary" data-panel="sets-panel" hidden>选择词卡集</button>
      <div class="card-meta"><span id="counter"></span></div>
      <button id="card" class="card" aria-label="翻转词卡"><span id="face-label" class="face-label"></span><span id="word" class="word" lang="ja"></span><span id="reading" class="reading" lang="ja"></span><span id="meaning" class="meaning"></span><span id="flip-hint" class="flip-hint">点击卡片，查看答案 ↻</span></button>
      <progress id="progress" value="1" max="1" aria-label="练习进度"></progress>
      <div class="controls"><button id="previous" class="secondary">← 上一张</button><button id="flip" class="primary">查看答案</button><button id="next" class="secondary">下一张 →</button></div>
      <div class="practice-footer"><span>快捷键：<kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>空格</kbd> 翻面</span><button id="restart" class="text-button">重新开始 ↺</button></div>
    </section>
  </main>
  <dialog id="preferences-panel" aria-labelledby="preferences-title">
    <div class="panel-heading"><h2 id="preferences-title">偏好设置</h2><button class="close-panel secondary" aria-label="关闭偏好设置" autofocus>关闭</button></div>
    <p class="muted">自动保存到此浏览器。更改顺序或卡片正面会开始新一轮练习。</p>
    <fieldset><legend>练习顺序</legend><label><input type="radio" name="order" value="ordered" checked><span>顺序练习</span></label><label><input type="radio" name="order" value="random"><span>随机练习</span></label></fieldset>
    <label class="direction-label">卡片正面 <select id="direction"><option value="ja">日语</option><option value="zh">中文</option></select></label>
  </dialog>
  <dialog id="history-panel" aria-labelledby="history-title">
    <div class="panel-heading"><h2 id="history-title">练习历史</h2><button class="close-panel secondary" aria-label="关闭练习历史" autofocus>关闭</button></div>
    <p class="muted">翻开答案即计为已复习，每轮同一张卡只计一次。记录保存在此浏览器，保留最近 100 轮。</p>
    <p id="history-empty">还没有练习记录。翻开第一张卡片，开始今天的练习吧。</p>
    <ol id="history-list"></ol>
  </dialog>
  <p id="storage-status" role="status"></p>
</body>
</html>
