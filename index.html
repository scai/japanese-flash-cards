<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按课学习日语单词：中日双语闪卡，支持多个词卡集与随机练习。">
  <meta name="theme-color" content="#2744cb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="言葉">
  <title>言葉 · 日语词卡</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="textbook-sets.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="./" aria-label="言葉 · 日语词卡"><img class="logo" src="icon-512.png" width="43" height="43" alt=""><span>言葉 <small>日语词卡</small></span></a>
    <div class="header-context"><span id="lesson"></span><span id="loaded" class="badge"></span></div>
    <div class="menu-wrap"><button id="menu-button" class="secondary" aria-label="菜单" title="菜单" aria-expanded="false" aria-controls="app-menu"><span aria-hidden="true">☰</span></button><nav id="app-menu" aria-label="应用菜单" hidden><button data-practice="lessons" aria-pressed="true">课程练习</button><button data-practice="starred" aria-pressed="false">星标词练习</button><button data-panel="sets-panel">词卡集管理</button><button data-panel="preferences-panel">偏好设置</button><button data-panel="history-panel">练习历史</button></nav></div>
  </header>
  <main>
    <dialog id="sets-panel" aria-labelledby="sets-title" title="选择一课，或把多课一起练习。" aria-description="选择一课，或把多课一起练习。">
      <div class="panel-heading"><h2 id="sets-title">词卡集管理</h2><button class="close-panel secondary icon-close" aria-label="关闭词卡集管理" autofocus><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="section-heading"><h3>我的词卡集</h3><span id="set-count"></span></div>
      <div id="sets"></div>
    </dialog>
    <section class="practice" aria-label="闪卡练习">
      <button id="choose-sets" class="secondary" data-panel="sets-panel" hidden>选择词卡集</button>
      <div class="card-meta"><span id="counter"></span></div>
      <div id="card-shell" class="card-shell">
        <button id="card" class="card" aria-label="翻转词卡"><span id="face-label" class="face-label"></span><span id="word" class="word" lang="ja"></span><span id="reading" class="reading" lang="ja"></span><span id="meaning" class="meaning"></span><span id="flip-hint" class="flip-hint">点击卡片，查看答案 ↻</span></button>
        <span id="speech-status" class="speech-status" role="status"></span>
      </div>
      <progress id="progress" value="1" max="1" aria-label="练习进度"></progress>
      <div class="controls"><button id="previous" class="secondary">← 上一张</button><button id="microphone" class="secondary" aria-label="语音输入" aria-pressed="false" title="语音输入"><span aria-hidden="true">🎤</span><span id="microphone-label">语音关闭</span></button><button id="star" class="secondary" aria-label="添加星标" aria-pressed="false" title="添加星标">☆</button><button id="next" class="secondary">下一张 →</button></div>
      <p id="voice-status" role="status" class="sr-only"></p>
    </section>
  </main>
  <dialog id="preferences-panel" aria-labelledby="preferences-title" title="自动保存到此浏览器。更改练习顺序会开始新一轮练习。" aria-description="自动保存到此浏览器。更改练习顺序会开始新一轮练习。">
    <div class="panel-heading"><h2 id="preferences-title">偏好设置</h2><button class="close-panel secondary icon-close" aria-label="关闭偏好设置" autofocus><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <label class="direction-label">自动播放日语发音 <input id="auto-pronounce" class="preference-switch" type="checkbox" role="switch" checked></label>
    <label class="direction-label">练习顺序 <select id="order"><option value="ordered">顺序练习</option><option value="random">随机练习</option></select></label>
    <label class="direction-label">横屏导航位置 <select id="navigation-side"><option value="right">右侧</option><option value="left">左侧</option></select></label>
  </dialog>
  <dialog id="history-panel" aria-labelledby="history-title">
    <div class="panel-heading"><h2 id="history-title">练习历史</h2><button class="close-panel secondary icon-close" aria-label="关闭练习历史" autofocus><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <p class="muted">翻开答案即计为已复习，每轮同一张卡只计一次。记录保存在此浏览器，保留最近 100 轮。</p>
    <p id="history-empty">还没有练习记录。翻开第一张卡片，开始今天的练习吧。</p>
    <ol id="history-list"></ol>
  </dialog>
  <p id="storage-status" role="status"></p>
  <footer class="practice-footer"><span>快捷键：<kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>空格</kbd> 翻面</span><button id="restart" class="text-button">重新开始 ↺</button></footer>
</body>
</html>
